[project]
name = "txn-categorizer"
version = "0.1.0"
description = "Categorize bank-transaction descriptions: classical ML vs. fine-tuned encoder vs. LLM, compared rigorously."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.9",
]

[project.scripts]
txncat = "txncat.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txncat"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs PostgreSQL at DATABASE_URL (skipped when it is unreachable)",
]

[tool.mypy]
# Lenient on purpose (SPEC §4): catch obvious mistakes without fighting untyped ML libraries.
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
