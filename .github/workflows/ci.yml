name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint, type-check, test (CPU only, no paid APIs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: txncat
          POSTGRES_PASSWORD: txncat
          POSTGRES_DB: txncat
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U txncat -d txncat"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://txncat:txncat@localhost:5433/txncat
      REQUIRE_DB: '1' # DB tests fail (instead of skipping) if the service container is unreachable
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run python scripts/check_private_data.py
      - run: uv run pytest --cov=txncat --cov-report=term-missing
