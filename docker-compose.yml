# Local PostgreSQL 16 for the Transaction Categorizer. Dev-only credentials, not secrets.
# Host port 5433 so it can run next to MolLookUp's Postgres on 5432.
name: txncat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: txncat
      POSTGRES_PASSWORD: txncat
      POSTGRES_DB: txncat
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the schema on first start; `txncat db init` does the same on demand.
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_external_test.sql:/docker-entrypoint-initdb.d/002_external_test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txncat -d txncat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
